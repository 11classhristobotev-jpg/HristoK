<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти - Банките в организацията на търговските плащания</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <div class="container header-flex">
        <a href="index.html" class="logo">
            <img src="logo.JFIF " alt="Лого на Финансови системи">
        </a>

        <nav aria-label="Основна навигация">
            <ul class="nav-links">
                <li><a href="index.html" class="nav-btn">Начало</a></li>
                <li><a href="grafiki.html" class="nav-btn">Галерия</a></li>
                <li><a href="kontakti.html" class="nav-btn active">Контакти</a></li>
                <li><a href="aboutme.html" class="nav-btn">За мен</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="content container contacts-page">
        <h1 class="page-title">Свържете се с мен</h1>
        <div class="contact-wrapper">
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Име:</label>
                    <input type="text" id="name" placeholder="Вашето име" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Вашият email адрес" required>
                </div>
                <div class="form-group">
                    <label for="message">Съобщение:</label>
                    <textarea id="message" placeholder="Напишете вашето съобщение тук..." rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Изпрати</button>
            </form>
            <aside class="social-section">
                <h3>Последвайте ни:</h3>
                <div class="social-icons">
                    <a href="#" class="social-link facebook">Facebook</a>
                    <a href="#" class="social-link instagram">Instagram</a>
                    <a href="#" class="social-link twitter">Twitter</a>
                </div>
            </aside>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; Христо Караиванов | 2025/2026</p>
    </div>
</footer>

</body>
</html>
